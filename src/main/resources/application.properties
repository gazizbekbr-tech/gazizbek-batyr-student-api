spring.application.name=gazizbek-batyr-student-api
server.port=${SERVER_PORT:8091}

# Student owner of this application (shown on / and in the logs)
student.full-name=Batyr Gazizbek
student.group=IT2-2301
student.id=38091
student.seed-data=true

# Database: values come from environment variables (see docker-compose.yml / .env)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gazizbek_batyr_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:gazizbek_batyr}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.info.build.enabled=true
